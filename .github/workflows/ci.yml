name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ hashFiles('.godot-version') }}
      - run: make setup
      - run: make check
      # Add `make sim` here once M2.6 lands.
